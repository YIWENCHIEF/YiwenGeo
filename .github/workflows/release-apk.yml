name: Release APK

# 推送 v* 标签（如 v3.7）时自动构建 debug APK 并创建 GitHub Release 附上安装包
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # android-actions/setup-android@v3 的默认包配置因 Google 2026.9 调整 SDK 包而损坏
      # （上游 issue #539/#546 未修），改用 runner 预装 SDK 的 sdkmanager 显式安装所需包。
      - name: Set up Android SDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew :app:assembleDebug

      - name: Rename APK to product name
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
             "YiwenGeo-${GITHUB_REF_NAME}.apk"

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          name: "YiwenGeo ${{ github.ref_name }}"
          files: YiwenGeo-*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
